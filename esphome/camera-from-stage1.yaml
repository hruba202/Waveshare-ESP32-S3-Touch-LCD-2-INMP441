# Original camera settings, enabled only by profiles/GPIO18.yaml (V1).
esphome:
  includes:
    - camera_preview.h

i2c:
  - id: camera_bus
    sda: GPIO21
    scl: GPIO16
    scan: false

esp32_camera:
  id: board_camera
  name: Camera
  external_clock:
    pin: GPIO8
    frequency: 20MHz
  i2c_id: camera_bus
  data_pins: [GPIO12, GPIO13, GPIO15, GPIO11, GPIO14, GPIO10, GPIO7, GPIO2]
  vsync_pin: GPIO6
  href_pin: GPIO4
  pixel_clock_pin: GPIO9
  power_down_pin: GPIO17
  resolution: 1024x768
  jpeg_quality: 12
  horizontal_mirror: false
  vertical_flip: false
  max_framerate: 5 fps
  idle_framerate: 1 fps
  frame_buffer_count: 1
  on_image:
    then:
      - lambda: |-
          camera_preview::accept(image.data, image.length);
